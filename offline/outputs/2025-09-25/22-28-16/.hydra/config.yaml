env:
  name: CartPole-v1
  task: ''
  library: minari
  n_samples_stats: 1000
  seed: 0
  backend: gymnasium
collector:
  frames_per_batch: 200
  total_frames: 1000000
  multi_step: 0
  init_random_frames: 1000
  env_per_collector: 1
  device: null
  max_frames_per_traj: 200
  annealing_frames: 10000
  eps_start: 1.0
  eps_end: 0.01
logger:
  backend: wandb
  project_name: torchrl_example_cql
  group_name: null
  exp_name: cql_${replay_buffer.dataset}
  eval_iter: 5000
  eval_steps: 1000
  mode: online
  eval_envs: 5
  video: true
replay_buffer:
  env: CartPole-v1
  dataset: CartPole-v2-random-v1
  batch_size: 128
  episodes: 10000
optim:
  device: null
  lr: 0.0003
  weight_decay: 0.0
  gradient_steps: 100000
  policy_eval_start: 40000
model:
  hidden_sizes:
  - 256
  - 256
  activation: relu
loss:
  loss_function: l2
  gamma: 0.99
  tau: 0.005
  action_space: categorical
compile:
  compile: false
  compile_mode: null
  cudagraphs: false
